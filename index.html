<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link
			rel="icon"
			type="image/png"
			href="assets/favicon/favicon-96x96.png"
			sizes="96x96"
		/>
		<link rel="shortcut icon" href="assets/favicon/favicon.ico" />

		<link rel="stylesheet" href="assets/css/style.css" />

		<title>Atlético Mineiro</title>
	</head>
	<body>
		<div class="container">
			<header class="header">
				<img
					src="assets/img/Clube_Atlético_Mineiro.svg.png"
					alt="Logo Atletico Mineiro"
					width="40px"
				/>
				<h1>Atlético Mineiro</h1>
			</header>
			<nav class="navigation">
				<ul>
					<li>
						<a href="index.html" class="active">Jogadores </a>
					</li>
					<li>
						<a href="stats.html">Estatisticas</a>
					</li>
				</ul>
			</nav>
			<main>
				<section class="filters">
					<h2>Busca de Jogadores</h2>
					<div class="mainFilters">
						<div class="searchBox">
							<input
								type="text"
								name="names"
								id="names"
								placeholder="pesquisar..."
							/>
						</div>

						<div class="filterBox">
							<select id="position">
								<option value="">Filtrar por posição</option>
								<option value="goleiro">Goleiro</option>
								<option value="zagueiro">Zagueiro</option>
								<option value="meia">Meia</option>
								<option value="atacante">Atacante</option>
							</select>
						</div>
					</div>

					<div class="sortBox">
						<span>Filtrar por:</span>
						<div class="sortButtonsArea">
							<div class="sortButtons">
								<span>Idade</span>
								<div class="buttonsArea">
									<button type="button" data-sort="age-asc" id="ageAsc">
										<svg
											xmlns="http://www.w3.org/2000/svg"
											width="24"
											height="24"
											viewBox="0 0 24 24"
											fill="none"
											stroke="currentColor"
											stroke-width="2"
											stroke-linecap="round"
											stroke-linejoin="round"
											class="lucide lucide-arrow-down01-icon lucide-arrow-down-0-1"
										>
											<path d="m3 16 4 4 4-4" />
											<path d="M7 20V4" />
											<rect x="15" y="4" width="4" height="6" ry="2" />
											<path d="M17 20v-6h-2" />
											<path d="M15 20h4" />
										</svg>
									</button>

									<button type="button" data-sort="age-desc" id="ageDesc">
										<svg
											xmlns="http://www.w3.org/2000/svg"
											width="24"
											height="24"
											viewBox="0 0 24 24"
											fill="none"
											stroke="currentColor"
											stroke-width="2"
											stroke-linecap="round"
											stroke-linejoin="round"
											class="lucide lucide-arrow-up01-icon lucide-arrow-up-0-1"
										>
											<path d="m3 8 4-4 4 4" />
											<path d="M7 4v16" />
											<rect x="15" y="4" width="4" height="6" ry="2" />
											<path d="M17 20v-6h-2" />
											<path d="M15 20h4" />
										</svg>
									</button>
								</div>
							</div>
							<div class="sortButtons">
								<span>Ordem alfabetica</span>
								<div class="buttonsArea">
									<button type="button" data-sort="name-asc" id="nameAsc">
										<svg
											xmlns="http://www.w3.org/2000/svg"
											width="24"
											height="24"
											viewBox="0 0 24 24"
											fill="none"
											stroke="currentColor"
											stroke-width="2"
											stroke-linecap="round"
											stroke-linejoin="round"
											class="lucide lucide-arrow-down-az-icon lucide-arrow-down-a-z"
										>
											<path d="m3 16 4 4 4-4" />
											<path d="M7 20V4" />
											<path d="M20 8h-5" />
											<path d="M15 10V6.5a2.5 2.5 0 0 1 5 0V10" />
											<path d="M15 14h5l-5 6h5" />
										</svg>
									</button>

									<button type="button" data-sort="name-desc" id="nameDesc">
										<svg
											xmlns="http://www.w3.org/2000/svg"
											width="24"
											height="24"
											viewBox="0 0 24 24"
											fill="none"
											stroke="currentColor"
											stroke-width="2"
											stroke-linecap="round"
											stroke-linejoin="round"
											class="lucide lucide-arrow-up-za-icon lucide-arrow-up-z-a"
										>
											<path d="m3 8 4-4 4 4" />
											<path d="M7 4v16" />
											<path d="M15 4h5l-5 6h5" />
											<path d="M15 20v-3.5a2.5 2.5 0 0 1 5 0V20" />
											<path d="M20 18h-5" />
										</svg>
									</button>
								</div>
							</div>

							<div class="sortButtons">
								<span>Limpar ordenação</span>
								<div class="buttonsArea">
									<button type="button" data-sort="clear-sort" id="clearSort">
										<svg
											xmlns="http://www.w3.org/2000/svg"
											width="24"
											height="24"
											viewBox="0 0 24 24"
											fill="none"
											stroke="currentColor"
											stroke-width="2"
											stroke-linecap="round"
											stroke-linejoin="round"
											class="lucide lucide-trash-icon lucide-trash"
										>
											<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
											<path d="M3 6h18" />
											<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
										</svg>
									</button>
								</div>
							</div>
						</div>
					</div>
				</section>

				<section class="results">
					<h2>Jogadores</h2>
					<p id="playersCounter"></p>
					<ul class="playersList" id="playersList"></ul>
				</section>
			</main>
		</div>
		<div class="modal" id="playerModal">
			<div class="modalContent">
				<button id="closeModal">✖</button>

				<div id="modalPlayerInfo"></div>
			</div>
		</div>
		<button id="backToTop" class="backToTop">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="30"
				height="30"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				class="lucide lucide-move-up-icon lucide-move-up"
			>
				<path d="M8 6L12 2L16 6" />
				<path d="M12 2V22" />
			</svg>
		</button>
		<!-- <script src="assets/js/playersData.js"></script> -->
		<script src="assets/js/api.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
